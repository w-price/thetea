[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "the-tea"
version = "0.1.0"
description = "A social prediction party game"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-Login>=0.6.3,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

